name: Deploy CloudNav to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # PASSWORD 来自仓库 Secret，运行期注入 wrangler.jsonc（不落库）
      - name: Inject PASSWORD into wrangler config
        env:
          CLOUDNAV_PASSWORD: ${{ secrets.CLOUDFLARE_CLOUDNAV_PASSWORD }}
        run: |
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));c.vars=c.vars||{};c.vars.PASSWORD=process.env.CLOUDNAV_PASSWORD;fs.writeFileSync('wrangler.jsonc',JSON.stringify(c,null,2));"

      - name: Deploy with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name cloudnav
